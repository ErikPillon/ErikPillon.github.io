# About the Author
author-about: >
  Hi, and thanks for passing by! I'm an Actuary with a background in pure Mathematics and Theoretical Physics, 
  currently training for my first 70.3 Ironman in September 2026. From September I'll be also pursuing a 
  MSc in Actuarial Science and Financial Engineering at KU Leuven.
  <br><br>
  While I'm not a professional software developer anymore, I keep developing webapps and tiny utilities in my free time; feel free to have a look at my <a href="/project">Projects page</a> to see what I'm building.
  <br><br>
  As all curious minds do, I always feel that I never have time to develop as many projects as I want, so my projects naturally revolve around my current interests, like building some sort of financial independence and sharpening my decision-making processes, triathlon, and science communication.
  <br><br>
  <b>Financial Independence</b><br>
  I'm currently working on a personal finance webapp to track my expenses and investments, and to help me make better financial decisions. Feel free to check it out <a href="https://fintools.vercel.app/" target="_blank">here</a> and to either register or play around with your imaginary portfolio.
  <br><br>
  Ideas rarely show up when I'm ready for them, so I'm building a
  <a href="https://distill-two-pi.vercel.app/" target="_blank">second brain</a> — part analog notebook, part
  digital tool, still very much a work in progress — to capture and connect them.
  <br><br>
  <b>Science Communication</b><br>
  Outreach has stayed a constant since my PhD years leading <a href="https://luxdoc.github.io/" target="_blank">LuxDoc</a>, the
  University of Luxembourg's PhD Students Association. These days it takes the shape of
  <a href="https://scientificchronicles.substack.com/" target="_blank">Scientific Chronicles</a>, a newsletter on
  the people, dates and discoveries that shaped science, and its companion site,
  <a href="https://scientific-chronicles.vercel.app/" target="_blank">Scientific Chronicles: Anniversaries</a>, a
  growing archive of scientific anniversaries.
  <br><br>
  <b>Off the Clock</b><br>
  I'm a competitive triathlete, currently training for my first 70.3 Ironman on 20 September 2026 (half-marathon
  PB so far is 1:30:37). Race season has quietly retired a few old side projects along the way — a triathlon
  training dashboard, <a href="https://f1analytics.github.io" target="_blank">F1 Analytics</a> and a couple of
  others — but you can still find them, archived, on my
  <a href="/project">Projects page</a>.
  <br><br>
  <b>Academic Background</b><br>
  Before all that, I was a physicist. My PhD research focused on efficient numerical methods for non-adiabatic
  quantum dynamics, specifically the molecular Aharonov-Bohm effect, and you can find an accessible introduction to that
  work <a href="/assets/forum_EP.pdf">here</a>.

