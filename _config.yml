# 60 Words About the Author
author-about: I’m a Mathematician by training, I focused as a postgraduate student in the modelization of the (molecular) Aharonov-Bohm effect in simple molecular systems. 
              Particular emphasys was devoted to the development of efficient numerical techniques based on the rigorous mathematical threatment of non-abelian gauge structures 
              underlying non-adiabatic phenomena in physics and chemistry. My other scientific interests cover the development and improvements of Machine Learning techniques 
              for the prediction of molecular and chemical properties.</br>
              </br>
              <b>Outreaching</b></br>
              I started cultivating my passion fort Science Communication during my Bachelor Studies in 2016, when I started sharing my interests in pop science books 
              through series of articles on <a href="www.mathone.it">Mathone.it</a>, on my Facebook pages (<a href="https://www.facebook.com/Phi6Passion">Phi6 Passion</a> and 
              <a href="https://www.facebook.com/LaGaiaScienzaF">La Gaia Scienza</a>) and on the platform Quora. 
              More recently, I joined the PhD Students Association <a href="https://luxdoc.uni.lu">LuxDoc</a>, where I also had the pleasure of serving many roles in the committee board.
              As President, I had the opportunity of supervising and co-organize several outreaching activities that involved either Private and Public Stakeholders, 
              from the Luxembourgish ScienceSlam to the "3 Minutes Thesis" Competition. 
              Feel free to visit my Projects page for further details.</br> 
              <br>
              </br>
              <b>Additional Interests and Free Time</b><br>
              In my free time I like reading popular science, philosophy and history books; I’m a great Formula1 fan and I cultivate my passion for numismatic. 
              I’m a former cyclist and cycling coach, but now I simply enjoy discovering Luxembourgish landscapes with my bike. 
              I enjoy challenging myself with some computational/mathematical puzzle, I often play board games and I’m a chess amateur player.

